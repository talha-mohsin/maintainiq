# MaintainIQ CI/CD Pipeline
# ============================================================
# CI  — runs on every push/PR: install → lint → test → build → audit → docker
# CD  — runs on push to main after CI passes: deploy to AWS EC2 + S3
# ============================================================

name: MaintainIQ CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel duplicate runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

# ============================================================
# JOB 1 — Continuous Integration
# ============================================================
jobs:
  ci:
    name: CI — Lint, Build & Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }} LTS
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint Checks
        run: npm run lint

      - name: Run Backend Tests
        run: npm test

      - name: Build Frontend & Backend
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build-${{ github.sha }}
          path: |
            frontend/dist/
            backend/dist/
          retention-days: 7

      - name: Security Audit
        run: npm audit --audit-level=high
        continue-on-error: true

  # ============================================================
  # JOB 2 — Docker Validation
  # ============================================================
  docker-validate:
    name: Docker — Build Validation
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Image Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: maintainiq:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # JOB 3 — CD: Deploy Backend to AWS EC2 (main branch only)
  # ============================================================
  deploy-backend:
    name: CD — Deploy Backend to EC2
    runs-on: ubuntu-latest
    needs: [ci, docker-validate]
    timeout-minutes: 20
    # Only deploy on push to main (not PRs)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 15m
          script: |
            set -e

            echo "📦 Navigating to app directory..."
            cd /home/${{ secrets.EC2_USER }}/maintainiq

            echo "🔄 Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "📥 Installing workspace dependencies..."
            npm ci --include=dev

            echo "🏗️ Building application..."
            npm run build

            echo "🚀 Reloading PM2..."
            pm2 reload ecosystem.config.cjs --update-env

            echo "⏳ Waiting for health check..."
            sleep 5
            curl --fail --silent --max-time 10 http://localhost:3000/health || exit 1

            echo "✅ Backend deployment successful!"

      - name: Rollback on Failure
        if: failure()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🔙 Rolling back to previous commit..."
            cd /home/${{ secrets.EC2_USER }}/maintainiq
            git reset --hard HEAD~1
            npm ci --include=dev
            npm run build
            pm2 reload ecosystem.config.cjs --update-env
            echo "⚠️ Rollback complete."

  # ============================================================
  # JOB 4 — CD: Deploy Frontend to AWS S3 + CloudFront
  # ============================================================
  deploy-frontend:
    name: CD — Deploy Frontend to S3/CloudFront
    runs-on: ubuntu-latest
    needs: [ci, docker-validate]
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }} LTS
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend with Production API URL
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.APP_URL }}/api

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync Frontend to S3
        run: |
          aws s3 sync frontend/dist/ s3://${{ secrets.S3_BUCKET_NAME }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"

          # index.html must not be cached (always fresh)
          aws s3 cp frontend/dist/index.html s3://${{ secrets.S3_BUCKET_NAME }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Frontend Deployment Complete
        run: echo "✅ Frontend deployed to S3 + CloudFront successfully!"
