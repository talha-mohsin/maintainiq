# MaintainIQ CI/CD Pipeline
name: MaintainIQ Continuous Integration & Deployment

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Quality Assurance: Lint, Typecheck, and Test
  audit-and-build:
    name: Code Audit and Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Application Dependencies
        run: npm ci

      - name: Run Linter Checks
        run: npm run lint

      - name: Validate Frontend Compilation
        run: npm run build

      - name: Validate Backend Compilation
        run: |
          cd backend
          npm ci
          npm run build

  # Docker Validation: Build Container Image
  docker-verify:
    name: Docker Containerization Dry-Run
    runs-on: ubuntu-latest
    needs: audit-and-build

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Dry-Run Build Unified Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: maintainiq:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
