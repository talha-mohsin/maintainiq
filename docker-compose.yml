# MaintainIQ — Docker Compose (Local Development)
# Mirrors the decoupled production topology: backend API (EC2/PM2 equivalent)
# + frontend static SPA (S3/CloudFront equivalent) + local Mongo/Redis.
# Usage: docker compose up --build

services:
  # Backend API (Express) — built from the backend workspace only
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maintainiq-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/maintainiq
      - REDIS_URL=redis://redis:6379
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Frontend static SPA — served by Nginx, calls the backend container over HTTP
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000/api
    container_name: maintainiq-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Local Redis Cache
  redis:
    image: redis:7-alpine
    container_name: maintainiq-cache
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local MongoDB
  mongodb:
    image: mongo:7
    container_name: maintainiq-db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  redis-data:
    driver: local
  mongo-data:
    driver: local
