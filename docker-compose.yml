# MaintainIQ — Docker Compose (Local Development)
# For production: use the Dockerfile directly on EC2 + PM2.
# For local: docker compose up --build

services:
  # MaintainIQ Unified Full-Stack Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maintainiq-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/maintainiq
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-local-dev-jwt-secret-change-in-production}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Local Redis Cache
  redis:
    image: redis:7-alpine
    container_name: maintainiq-cache
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local MongoDB
  mongodb:
    image: mongo:7
    container_name: maintainiq-db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  redis-data:
    driver: local
  mongo-data:
    driver: local
